<div class="col">
  <h4> Agregar Personaje de Dragon Ball</h4>
  <form class="row" (ngSubmit)="emitCharacter()">
    <input
      type="text"
      [(ngModel)]="character.name"
      name="name"
      class="form-control mb-2"
      placeholder="Nombre" required
      #txtNameInput
      >
    <input type="number"
      [(ngModel)]="character.power"
      name="power"
      [value]="character.power"
      class="form-control mb-2" placeholder="Poder">
    <button type="submit" #powerButton class="btn btn-primary">Agregar</button>
  </form>
</div>
